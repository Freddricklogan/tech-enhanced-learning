name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & validate (Jekyll build + html-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build (strict front matter) and validate every page
        run: npm run check
        env:
          JEKYLL_ENV: production
      - name: Internal link check on the built site
        run: node scripts/check-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  link-check:
    name: Link check (advisory)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429,999
            --exclude 'github.com/${{ github.repository }}/actions'
            --exclude 'freddricklogan.github.io/${{ github.event.repository.name }}'
            README.md docs/CASE_STUDY.md
          fail: true

  security:
    name: Security scan (npm audit + Trivy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [lint, security]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
